name: Hello Chat Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: |
          mkdir -p extracted
          unzip -q HelloChat_Android_Starter_Corrected.zip -d extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Hello Chat
        run: |
          PROJECT_DIR=$(find extracted -type d -name HelloChat | head -1)
          test -n "$PROJECT_DIR"
          echo "Project: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Build Hello Chat Admin
        run: |
          PROJECT_DIR=$(find extracted -type d -name HelloChatAdmin | head -1)
          test -n "$PROJECT_DIR"
          echo "Project: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Hello-Chat-APKs
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
