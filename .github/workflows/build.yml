name: Hello Chat Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Project ZIP
        run: |
          test -f HelloChat_Android_Starter_Corrected.zip

      - name: Extract Android Project
        run: |
          mkdir -p extracted
          unzip -q HelloChat_Android_Starter_Corrected.zip -d extracted
          find extracted -name gradlew -type f

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Hello Chat
        run: |
          find extracted -type d -name HelloChat -print
          PROJECT=$(find extracted -type f -name gradlew | grep '/HelloChat/gradlew$' | head -1)
          test -n "$PROJECT"
          chmod +x "$PROJECT"
          cd "$(dirname "$PROJECT")"
          ./gradlew assembleDebug

      - name: Build Hello Chat Admin
        run: |
          PROJECT=$(find extracted -type f -name gradlew | grep '/HelloChatAdmin/gradlew$' | head -1)
          test -n "$PROJECT"
          chmod +x "$PROJECT"
          cd "$(dirname "$PROJECT")"
          ./gradlew assembleDebug

      - name: Upload APK Files
        uses: actions/upload-artifact@v4
        with:
          name: Hello-Chat-APKs
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
